<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SUMIBIKI 運営管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
  <header class="topbar">
    <a class="brand" href="#/dashboard">SUMIBIKI<span>運営管理</span></a>
    <span id="sync" class="sync local">このブラウザに保存</span>
  </header>
  <div class="layout">
    <nav class="nav" id="nav"></nav>
    <main id="view" class="view"></main>
  </div>

  <footer class="app-foot" aria-label="サイトへのリンク">
    <div class="app-foot-in">
      <a class="app-foot-mark" href="https://sumibiki.com/" target="_blank" rel="noopener">SUMIBIKI<span>sumibiki.com</span></a>
      <nav class="app-foot-links">
        <a href="https://sumibiki.com/" target="_blank" rel="noopener"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>サイト（日本語）</a>
        <a href="https://sumibiki.com/en/" target="_blank" rel="noopener"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>English</a>
        <a href="https://sumibiki.com/wp-admin/" target="_blank" rel="noopener"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9.5M18.5 7H20M4 17h3.5M12.5 17H20"/><circle cx="16" cy="7" r="2.3"/><circle cx="10" cy="17" r="2.3"/></svg>WordPress管理画面</a>
      </nav>
    </div>
  </footer>

  <dialog id="modal">
    <form method="dialog" id="modal-form">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="modal-cancel">キャンセル</button>
        <button type="submit" class="btn primary" id="modal-save">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm" class="confirm">
    <p id="confirm-msg"></p>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="confirm-cancel">キャンセル</button>
      <button type="button" class="btn primary" id="confirm-ok">OK</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
