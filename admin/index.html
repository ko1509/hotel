<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SUMIBIKI 運営管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/dashboard">SUMIBIKI<span>運営管理</span></a>
    <span id="sync" class="sync local">このブラウザに保存</span>
  </header>
  <div class="layout">
    <nav class="nav" id="nav"></nav>
    <main id="view" class="view"></main>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modal-form">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="modal-cancel">キャンセル</button>
        <button type="submit" class="btn primary" id="modal-save">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm" class="confirm">
    <p id="confirm-msg"></p>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="confirm-cancel">キャンセル</button>
      <button type="button" class="btn primary" id="confirm-ok">OK</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
